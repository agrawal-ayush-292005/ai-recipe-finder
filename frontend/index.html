<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Finder - 3D</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 3D Background Particles -->
    <div class="gradient-bg"></div>
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="auth-container" id="authSection">
        <div class="auth-box">
            <span class="logo">🍳</span>
            <h1>AI Recipe Finder</h1>
            <p class="subtitle">Discover delicious recipes from your ingredients</p>
            
            <!-- Login Form -->
            <div id="loginForm">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <label for="loginEmail">📧 Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">🔒 Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button id="loginBtn" class="btn-primary">Login</button>
                <p class="toggle-link">
                    Don't have an account? <a id="showRegisterLink">Register here</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="registerUsername">👤 Username</label>
                    <input type="text" id="registerUsername" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="registerEmail">📧 Email Address</label>
                    <input type="email" id="registerEmail" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="registerPassword">🔒 Password (min 6 characters)</label>
                    <input type="password" id="registerPassword" placeholder="Create a strong password">
                </div>
                <button id="registerBtn" class="btn-primary">Create Account</button>
                <p class="toggle-link">
                    Already have an account? <a id="showLoginLink">Login here</a>
                </p>
            </div>

            <div id="authMessage" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
