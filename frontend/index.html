<!DOCTYPE html>
<html>
<head>
    <title>AI Recipe Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .test-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .test-btn:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🍳 AI Recipe Finder</h1>
    <p>Your frontend is working!</p>
    
    <button class="test-btn" onclick="testAPI()">Test Backend Connection</button>
    
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '⏳ Testing connection...';
            
            try {
                // ✅ FIXED: Changed from 5000 to 3000
                const response = await fetch('http://localhost:3000/api/test');
                const data = await response.json();
                resultDiv.innerHTML = `
                    ✅ Backend is connected!<br>
                    Message: ${data.message}<br>
                    Timestamp: ${new Date().toISOString()}
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    ❌ Failed to connect to backend.<br>
                    Make sure the server is running!<br>
                    Error: ${error.message}
                `;
            }
        }
    </script>
</body>
</html>
