<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry - Join</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">
                <span class="logo-icon">🥘</span>
                <h1>pantry<span>®</span></h1>
            </a>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="index.html" data-i18n="home">Home</a>
            <a href="recipes.html" data-i18n="browse">Browse</a>
            <a href="pantry.html" data-i18n="yourPantry">Your Pantry</a>
            <a href="about.html" data-i18n="about">About</a>
            <a href="contact.html" data-i18n="contact">Contact</a>

            <!-- LANGUAGE SWITCHER -->
            <div class="language-switcher">
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 हिन्दी</option>
                    <option value="kn">🇮🇳 ಕನ್ನಡ</option>
                    <option value="mr">🇮🇳 मारवाड़ी</option>
                </select>
            </div>

            <a href="login.html" class="btn-nav btn-nav-secondary" data-i18n="signIn">
                <i class="fas fa-user"></i> Sign In
            </a>
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- REGISTER FORM -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-logo">🎁</span>
                <h1 data-i18n="joinForRewardsTitle">Join for Rewards!</h1>
                <p data-i18n="joinSubtitle">Get coupons, rewards, and personalized recipes!</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerUsername"><i class="fas fa-user"></i> <span data-i18n="usernameLabel">Username</span></label>
                    <input type="text" id="registerUsername" placeholder="Choose a username" data-i18n-placeholder="chooseUsername" required />
                </div>
                <div class="form-group">
                    <label for="registerEmail"><i class="fas fa-envelope"></i> <span data-i18n="emailLabel">Email</span></label>
                    <input type="email" id="registerEmail" placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder" required />
                </div>
                <div class="form-group">
                    <label for="registerPassword"><i class="fas fa-lock"></i> <span data-i18n="passwordLabel">Password</span></label>
                    <input type="password" id="registerPassword" placeholder="Min 6 characters" data-i18n-placeholder="passwordPlaceholder" required />
                </div>
                <button type="submit" class="btn-submit" id="registerBtn">
                    <i class="fas fa-gift"></i> <span data-i18n="createAccountBtn">Create Account & Get Rewards 🎁</span>
                </button>
                <div class="auth-toggle">
                    <span data-i18n="alreadyAccount">Already have an account?</span> <a href="login.html" data-i18n="signInHere">Sign In</a>
                </div>
                <div id="registerMessage" class="auth-message"></div>
            </form>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
