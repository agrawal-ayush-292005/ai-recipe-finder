<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry - Sign In</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">
                <span class="logo-icon">🥘</span>
                <h1>pantry<span>®</span></h1>
            </a>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="recipes.html">Browse</a>
            <a href="pantry.html">Your Pantry</a>
            <a href="about.html">About</a>
            <a href="login.html" class="btn-nav btn-nav-primary">
                <i class="fas fa-user"></i> Sign In
            </a>
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-logo">🥘</span>
                <h1>Welcome Back!</h1>
                <p>Sign in to save recipes and earn rewards 🎁</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required />
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>
                <div class="auth-toggle">
                    Don't have an account? <a href="register.html">Join for Rewards</a>
                </div>
                <div id="authMessage" class="auth-message"></div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
